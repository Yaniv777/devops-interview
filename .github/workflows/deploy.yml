on:
  workflow_dispatch:
    inputs:
      site_name:
        description: 'name of the site'
        required: false
        type: string

jobs:
  Prepare-the-Runner:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v3
      - run: ansible-galaxy role install kameshsampath.minikube
      - run: ansible-playbook --connection=local --inventory localhost, ansible/site.yml