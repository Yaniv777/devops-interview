on:
  workflow_dispatch:
    inputs:
      site_name:
        description: 'name of the site'
        required: true
        type: string

jobs:
  devops-interview:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v3
      # Prepare the Runner
      - name: Run Ansible Playbook
        run: ansible-playbook --connection=local --inventory localhost, ansible/site.yml
      # Start Kubernetes
      - name: Startu Minikube Cluster
        run: minikube start
      # Deploy the Application
      - name: Helm Install
        run: helm install ${{github.event.inputs.site_name}} ./helm --set siteName=${{github.event.inputs.site_name}} --namespace ${{github.event.inputs.site_name}} --create-namespace
      # Verification
      - name: Switch to Deployment Namespace
        run: kubectl config set-context --current --namespace=${{github.event.inputs.site_name}}
      - name: Check if Output is Correct
        run: |
          IP=$(kubectl get service ${{github.event.inputs.site_name}} -o jsonpath='{.spec.clusterIP}')
          kubectl wait --for=condition=Ready pod/${{github.event.inputs.site_name}} --timeout=60s
          RESPONSE=$(kubectl run test-curl --image=curlimages/curl --restart=Never --rm -i -- -s http://$IP:5678)
          EXPECTED="hello ${{github.event.inputs.site_name}}"
          echo "$RESPONSE"
          if [[ "$RESPONSE" == *"$EXPECTED"* ]]; then
            exit 0
          else
            exit 1
          fi
          