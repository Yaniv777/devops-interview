on:
  workflow_dispatch:
    inputs:
      site_name:
        description: 'name of the site'
        required: false
        type: string

jobs:
  devops-interview:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v3
      # Prepare the Runner
      - run: ansible-playbook --connection=local --inventory localhost, ansible/site.yml
      # Start Kubernetes
      - run: minikube start
      # Deploy the Application
      - run: helm install ${{github.event.inputs.site_name}} ./helm --set siteName=${{github.event.inputs.site_name}} --namespace ${{github.event.inputs.site_name}} --create-namespace
      # Verification
      - run: kubectl config set-context --current --namespace=${{github.event.inputs.site_name}}
      - run: kubectl get services